---
driver:
  name: vagrant
  customize:
    cpus: 2
    memory: 4096
provisioner:
  name: chef_infra
  policyfile: Policyfile.rb
  product_name: cinc
  chef_license: accept-no-persist
  retry_on_exit_code: [35, 1190]
  wait_for_retry: 200
  max_retries: 2
verifier:
  name: inspec
transport:
  connection_retry_sleep: 120
  winrm_transport: plaintext
platforms:
  - name: windows-2016
    driver:
      box: tas50/windows_2016
  - name: windows-2019
    driver:
      box: tas50/windows_2019
  - name: windows-2022
    driver:
      box: tas50/windows_2022
suites:
  - name: default
    provisioner:
      named_run_list: default
      multiple_converge: 2
      enforce_idempotency: true
    verifier:
      inspec_tests: [test/integration/default]
  - name: forest
    provisioner:
      named_run_list: forest
    verifier:
      inspec_tests: [test/integration/forest]
  - name: objects
    provisioner:
      named_run_list: objects
    verifier:
      inspec_tests: [test/integration/default, test/integration/forest, test/integration/objects]
  - name: demotion
    provisioner:
      named_run_list: demotion
    verifier:
      inspec_tests: [test/integration/demotion]
